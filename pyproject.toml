[project]
name = "hornet"
version = "0.3.0"
description = "DevCentr Hornet harness — actor-model node graph on disk with Mixr routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hornet = "hornet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hornet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
